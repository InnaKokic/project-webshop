<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Hämtar ny font från google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <!-- Namnger vår sida så det syns i webbläsartaben och lägger till ikon-->
    <link rel="icon" type="image/png+xml" href="assets/icons/LogotypIkon.png" />
    <title>In Sisters Garden</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div id="topHeader">
        <button id="homeBtn">
          <img src="assets\icons\Home-Btn.png" id="homeBtnIcon" alt="home button" />
        </button>
        <div id="logoCrop">
          <img src="assets/images/Logotyp.png" alt="logga" id="logoImg" />
        </div>
      </div>
      <nav>
        <button class="navBtn" id="greenCat">Gröna växter</button>
        <button class="navBtn" id="flowerCat">Blommande växter</button>
        <button class="navBtn" id="cactCat">Suckulenter & kaktusar</button>

        <div id="cartContainer">
          <button id="cartBtn">
            <img src="assets/icons/Cart.png" id="cartIkon" alt="Kundvagn" />
          </button>
          <div id="counter"></div>
        </div>
      </nav>
    </header>

    <main>
      <section id="gallery">
        <!-- Produkterna hämtas in här från JavaScript -->
      </section>
    </main>

    <footer>
      <p class="footerText">&copy; 2025 In Sisters Garden AB</p>
      <p class="footerText">
        Created by Carol<span class="pinkText">in</span>e, <span class="pinkText">In</span>na & Josef<span
          class="pinkText"
          >in</span
        >e
      </p>
    </footer>

    <!-- Vår modal som byggs i js och stylas i css, lägger sig över hela sidan -->
    <div id="modal" class="modal hidden">
      <!-- modal är en class och hidden är en class -->
      <div class="modal-content">
        <button class="x-btn" id="closeModal">&times;</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
